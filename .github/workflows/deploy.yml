name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}
          VITE_NEWS_API_KEY: ${{ secrets.VITE_NEWS_API_KEY }}
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist

  deploy-vercel:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vercel deploys from source so it can build the api/ serverless function.
      # Env vars must be set in Vercel project dashboard (Settings → Environment Variables).
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-args: --prod
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-vercel-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-aliyun:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Setup ossutil
        run: |
          curl -L https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil

      # OSS_ENDPOINT should be set to: oss-cn-shanghai.aliyuncs.com
      - name: Configure ossutil
        run: |
          ossutil config \
            --access-key-id ${{ secrets.OSS_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            --region ${{ secrets.OSS_REGION }} \
            --endpoint ${{ secrets.OSS_ENDPOINT }} \
            --language EN

      - name: Deploy to Alibaba Cloud OSS
        run: |
          # Sync dist/ to OSS bucket root, remove stale files
          ossutil sync dist/ oss://${{ secrets.OSS_BUCKET }}/ \
            --delete \
            --force

          # Long-lived cache for fingerprinted assets
          ossutil set-meta oss://${{ secrets.OSS_BUCKET }}/assets/ \
            Cache-Control:"public, max-age=31536000, immutable" \
            --recursive \
            --update
